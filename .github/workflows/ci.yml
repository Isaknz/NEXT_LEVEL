name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} · MySQL 8
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: nextlevel_ci
          MYSQL_USER: nextlevel
          MYSQL_PASSWORD: nextlevel
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Código
        uses: actions/checkout@v4

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, gd, mbstring, mysqlnd, pdo_mysql, zip
          coverage: none

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validar composer.json
        run: composer validate --strict

      - name: Directorio de caché de Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Caché de Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Instalar dependencias PHP
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Auditoría de dependencias PHP
        run: composer audit

      - name: Instalar dependencias JS
        run: npm ci

      - name: Auditoría npm de producción
        run: npm audit --omit=dev --audit-level=high

      - name: Auditoría npm completa (informativa)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Compilar con Vite
        run: npm run build

      - name: Preparar entorno
        run: cp .env.example .env && php artisan key:generate --force

      - name: Migraciones
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: nextlevel_ci
          DB_USERNAME: nextlevel
          DB_PASSWORD: nextlevel
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          MAIL_MAILER: array

      - name: Pruebas
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: nextlevel_ci
          DB_USERNAME: nextlevel
          DB_PASSWORD: nextlevel
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          MAIL_MAILER: array
